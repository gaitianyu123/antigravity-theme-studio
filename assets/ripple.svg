<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="lakeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="42%" stop-color="#e8f1ff"/>
      <stop offset="78%" stop-color="#d2e4ff"/>
      <stop offset="100%" stop-color="#bdd7ff"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="65%" stop-color="#eef5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c6dcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="catHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 温柔晴空淡蓝水镜底色 -->
  <rect width="1600" height="900" fill="url(#lakeSky)"/>
  <rect width="1600" height="900" fill="url(#centerGlow)"/>

  <!-- 细微宁静同心水波涟漪 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <ellipse cx="1310" cy="760" rx="220" ry="52" stroke-width="2.4" opacity="0.55"/>
    <ellipse cx="1310" cy="760" rx="310" ry="74" stroke-width="1.8" opacity="0.38"/>
    <ellipse cx="1310" cy="760" rx="420" ry="98" stroke-width="1.3" opacity="0.24"/>
    <ellipse cx="185" cy="145" rx="74" ry="18" stroke-width="1.8" opacity="0.48"/>
    <ellipse cx="185" cy="145" rx="126" ry="30" stroke-width="1.2" opacity="0.28"/>
  </g>

  <!-- 左上角极简一叶纸舟 -->
  <g transform="translate(185, 136)">
    <path d="M-28,4 L28,4 L18,13 L-18,13 Z" fill="#ffffff" stroke="#8fb3e8" stroke-width="1.5"/>
    <path d="M-16,4 L0,-14 L14,4 Z" fill="#f8fbff" stroke="#8fb3e8" stroke-width="1.4"/>
  </g>

  <!-- 右下角柔光中蜷缩安睡的治愈奶油白猫 -->
  <g transform="translate(1310, 748)">
    <ellipse cx="0" cy="16" rx="156" ry="42" fill="url(#catHalo)"/>
    <!-- 温暖毛茸茸身体团 -->
    <path d="M-98,14 C-102,-42 -42,-78 24,-70 C78,-64 114,-30 110,16 C106,46 58,58 -6,58 C-62,58 -95,42 -98,14 Z"
          fill="#fffdf8" stroke="#c8d8f0" stroke-width="2.2"/>
    <!-- 柔和背部阴影层次 -->
    <path d="M-54,-52 C10,-66 74,-44 92,-4 C68,-18 16,-24 -42,-16 Z" fill="#f3efe6" opacity="0.65"/>
    <!-- 卷起的小尾巴 -->
    <path d="M84,22 C112,24 128,6 116,-14 C106,-28 84,-20 82,-6"
          fill="#fffdf8" stroke="#d1dff4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 酣睡猫脑袋 -->
    <g transform="translate(-52, 8)">
      <ellipse cx="0" cy="0" rx="46" ry="36" fill="#ffffff" stroke="#c8d8f0" stroke-width="2.2"/>
      <!-- 柔粉猫耳 -->
      <path d="M-34,-18 L-42,-44 L-14,-28 Z" fill="#ffffff" stroke="#c8d8f0" stroke-width="2"/>
      <path d="M12,-28 L34,-44 L32,-16 Z" fill="#ffffff" stroke="#c8d8f0" stroke-width="2"/>
      <path d="M-32,-21 L-37,-37 L-19,-27 Z" fill="#fce7f3"/>
      <path d="M16,-27 L30,-37 L28,-19 Z" fill="#fce7f3"/>
      <!-- 眯起安睡的弯弯睫毛与淡粉鼻尖 -->
      <path d="M-24,2 Q-16,10 -8,2" fill="none" stroke="#8597b5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8,3 Q16,11 24,3" fill="none" stroke="#8597b5" stroke-width="2.4" stroke-linecap="round"/>
      <polygon points="-3,12 3,12 0,16" fill="#f9a8d4"/>
      <ellipse cx="-24" cy="11" rx="6" ry="3.5" fill="#fbcfe8" opacity="0.7"/>
      <ellipse cx="22" cy="12" rx="6" ry="3.5" fill="#fbcfe8" opacity="0.7"/>
      <!-- 压在脸颊下的小爪子 -->
      <ellipse cx="-8" cy="28" rx="16" ry="9" fill="#ffffff" stroke="#c8d8f0" stroke-width="2"/>
    </g>
  </g>
</svg>
